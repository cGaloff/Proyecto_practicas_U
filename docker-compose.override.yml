# Se aplica automáticamente en desarrollo. NO usar en producción.
services:

  db:
    ports:
      - "5432:5432"

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5000:5000"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ppi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - ppi_net
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgadmin_data:
